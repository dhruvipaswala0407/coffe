<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffy solutions</title>
  <!-- icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <!-- font css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!--custom css-->
  <link href="./css/style.css" rel="stylesheet" />
  <link href="./image/favicon-16x16.png" rel="icon" />
  <link rel="stylesheet" href="./css/media.css" />
</head>
<body>
  <header>
    <div class="container">
      <div class="row">
        <div class="header-wrapper d-flex justify-between">
          <div class="logo">
              <img src="./image/logo.png" alt="logo"/>
          </div>
          <div class="none none-sm-open d-flex align-center justify-around w-10">
            <i class="ri-menu-line"></i>
            <i class="ri-search-line pl-10"></i>
          </div>
          <div class="navbar d-flex align-center justify-around nav-sm-none">
            <ul class="d-flex align-center justify-around">
              <a href=""><li>Home</li></a>
              <a href=""><li>Menu</li></a>
              <a href=""><li>Blog</li></a>
              <a href=""><li>Media</li></a>
              <a href=""><li>Contact</li></a>
              <a href=""><li><i class="ri-search-line"></i></li></a>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <section class="hero-section">
    <div class="container">
      <div class="row">
        <div class="overlay"></div>
        <div class="hero-container d-flex align-center justify-center pb-50">
          <div class="hero-content">
            <h1>Savor the Perfect Brew!</h1>
            <p class="pb-20">Freshly brewed coffee made from the finest beans to start your day right.</p>
            <div class="button-group d-flex">
              <a href="#" class="btn btn-primary">Get your coffee</a>
              <a href="#" class="btn btn-secondary pl-10">View Menu</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="row">
        
      </div>
    </div>
  </section>
